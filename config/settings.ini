[server]
server_exe = .\llama-server\llama-server.exe
extra_args = 
open_browser = 0
stop_on_exit = 1
mcp_config = .\config\mcp.json
use_mcp = 0

[paths]
models_ini = .\config\models.ini
bench_exe = .\llama-server\llama-bench.exe
output_dir = bench-results

[state]
server_last_model = example-qwen3.5-9b

[bench]
threads = 8
n-gpu-layers = 99
n-cpu-moe = 
fa = on
cache-type-k = q8_0
cache-type-v = q8_0
batch-size = 512
ubatch-size = 128
n-prompt = 512
n-gen = 128
repeats = 3
extra-args = 
show-diagnostics = 0

[sweeps]
batch = 512,1024,2048
ubatch = 128,256,512
kv = q8_0:q8_0,q8_0:q4_0,q4_0:q8_0,q4_0:q4_0
threads = 4,6,8,12,16
moe = 20,28,30

